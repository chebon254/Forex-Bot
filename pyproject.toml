[project]
name = "fxbot"
version = "1.0.0"
description = "Interest-rate differential + COT commercials bias for a MetaTrader 5 market-structure EA"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.28", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fxbot = "fxbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fxbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
